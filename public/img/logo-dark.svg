    <!-- Subtítulo de oficio -->
    <text x="0" y="38" font-family="'Roboto', 'Work Sans', sans-serif" font-size="10.5" font-weight="500" fill="#9CA3AF" letter-spacing="0.08em" text-transform="uppercase">
      Reparación de Techos · Estanqueidad
    </text>
  </g>
