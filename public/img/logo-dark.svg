    <path d="M28 2L4 12V28C4 42.5 14.5 54 28 58C41.5 54 52 42.5 52 28V12L28 2Z" fill="rgba(238, 130, 58, 0.12)" stroke="#EE823A" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- Techo principal a dos aguas -->
    <path d="M12 28L28 15L44 28" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Placa de zinguería interior -->
    <path d="M17 34L28 24.5L39 34" stroke="#EE823A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Detalle de estanqueidad -->
    <circle cx="28" cy="38" r="2.5" fill="#EE823A"/>
  </g>

  <!-- Tipografía del Isologotipo -->
  <g transform="translate(74, 14)">
