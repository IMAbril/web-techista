<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" fill="none" width="100%" height="100%">
  <!-- Isotipo: Escudo geométrico con techo y zinguería plegada -->
  <g transform="translate(4, 4)">
    <!-- Base sutil del escudo -->
    <path d="M28 2L4 12V28C4 42.5 14.5 54 28 58C41.5 54 52 42.5 52 28V12L28 2Z" fill="#FFF5EE" stroke="#EE823A" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- Techo principal a dos aguas (chapa y cumbrera) -->
    <path d="M12 28L28 15L44 28" stroke="#14171C" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Placa de zinguería / babeta interior -->
    <path d="M17 34L28 24.5L39 34" stroke="#EE823A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Detalle de estanqueidad / fijación -->
    <circle cx="28" cy="38" r="2.5" fill="#EE823A"/>
  </g>

  <!-- Tipografía del Isologotipo -->
  <g transform="translate(74, 14)">
    <!-- Nombre / Marca -->
    <text x="0" y="22" font-family="'Plus Jakarta Sans', 'Albert Sans', 'Roboto', sans-serif" font-size="20" font-weight="800" fill="#14171C" letter-spacing="-0.02em">
      TECHISTA &amp; ZINGUERÍA
    </text>
    <!-- Subtítulo de oficio -->
    <text x="0" y="38" font-family="'Roboto', 'Work Sans', sans-serif" font-size="10.5" font-weight="500" fill="#7E7D7D" letter-spacing="0.08em" text-transform="uppercase">
      Reparación de Techos · Estanqueidad
    </text>
  </g>
</svg>
